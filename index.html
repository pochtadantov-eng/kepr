<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kepr">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="app/icon.svg">
<link rel="icon" href="app/icon.svg">
<title>Kepr</title>
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<div id="app">
  <div class="toast" id="toast"></div>
  <section class="screen active" id="s-home"></section>
  <section class="screen" id="s-pay"></section>
  <section class="screen" id="s-city"></section>
  <section class="screen" id="s-chat"></section>
  <section class="screen" id="s-more"></section>
  <nav>
    <button class="on" data-t="home"><i>🏠</i>Главная</button>
    <button data-t="pay"><i>🧾</i>Платежи</button>
    <button data-t="city"><i>🗺️</i>Город</button>
    <button data-t="chat"><i>💬</i>Чат</button>
    <button data-t="more"><i>☰</i>Ещё</button>
  </nav>
  <div class="lock" id="lock"></div>
</div>
<script src="app/app.js"></script>
</body>
</html>

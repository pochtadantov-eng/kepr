<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kepr">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="app/icon.svg">
<link rel="icon" href="app/icon.svg">
<title>Kepr</title>
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<div id="app">
  <div class="toast" id="toast"></div>
  <section class="screen active" id="s-home"></section>
  <section class="screen" id="s-pay"></section>
  <section class="screen" id="s-city"></section>
  <section class="screen" id="s-chat"></section>
  <section class="screen" id="s-shop"></section>
  <nav>
    <button class="on" data-t="home"><svg viewBox="0 0 24 24"><path d="M12 2.5l8 2.5v6.2c0 5-3.4 8.6-8 10.3-4.6-1.7-8-5.3-8-10.3V5z"/><text x="12" y="15.4" text-anchor="middle" font-size="9.5" font-weight="900" fill="#000" font-family="Arial">K</text></svg>Главная</button>
    <button data-t="pay"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.3" fill="#000"/></svg>Платежи</button>
    <button data-t="city"><svg viewBox="0 0 24 24"><path d="M12 2.5l9.5 9.5-9.5 9.5L2.5 12z"/><path d="M12 7l5 5-5 5-5-5z" fill="#000"/></svg>Город</button>
    <button data-t="chat"><svg viewBox="0 0 24 24"><path d="M5 4h14a3 3 0 013 3v7a3 3 0 01-3 3h-6l-5 4v-4H5a3 3 0 01-3-3V7a3 3 0 013-3z"/></svg>Чат<b class="nb">9</b></button>
    <button data-t="shop"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2.5"/><rect x="13" y="3" width="8" height="8" rx="2.5"/><rect x="3" y="13" width="8" height="8" rx="2.5"/><rect x="13" y="13" width="8" height="8" rx="2.5"/></svg>Витрина</button>
  </nav>
  <div class="lock" id="lock"></div>
</div>
<script src="app/app.js"></script>
</body>
</html>
